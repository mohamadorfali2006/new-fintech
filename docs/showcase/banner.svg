<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="NewFinTech banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="0.55" stop-color="#101022"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <ellipse cx="980" cy="90" rx="260" ry="150" fill="url(#glow)"/>
  <ellipse cx="140" cy="330" rx="220" ry="130" fill="url(#glow)" opacity="0.6"/>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M150 0 V400 M350 0 V400 M550 0 V400 M750 0 V400 M950 0 V400"/>
  </g>

  <g>
    <rect x="880" y="230" width="34" height="90" rx="8" fill="url(#bar)">
      <animate attributeName="height" values="90;130;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;190;230" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="926" y="190" width="34" height="130" rx="8" fill="url(#bar)">
      <animate attributeName="height" values="130;90;130" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="190;230;190" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="972" y="250" width="34" height="70" rx="8" fill="url(#bar)">
      <animate attributeName="height" values="70;120;70" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="250;200;250" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1018" y="170" width="34" height="150" rx="8" fill="url(#bar)">
      <animate attributeName="height" values="150;100;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;220;170" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1064" y="210" width="34" height="110" rx="8" fill="url(#bar)">
      <animate attributeName="height" values="110;150;110" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;170;210" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M820 260 L880 230 L940 245 L1000 190 L1060 205 L1110 150"
        fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0;0;520;520" keyTimes="0;0.35;0.7;1;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle r="9" fill="#a855f7">
    <animateMotion dur="6s" repeatCount="indefinite" path="M820 260 L880 230 L940 245 L1000 190 L1060 205 L1110 150"/>
  </circle>

  <rect x="80" y="86" width="76" height="76" rx="20" fill="url(#brand)"/>
  <path d="M118 106 v50 M129 117 h-14 a7 7 0 0 0 0 14 h10 a7 7 0 0 1 0 14 h-22"
        stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="176" y="140" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">NewFinTech</text>
  <text x="80" y="212" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="url(#brand)">Your money, fully understood</text>
  <text x="80" y="258" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" fill="#a1a1aa">Track spending, master budgets, and let AI find your savings.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="80" y="292" width="150" height="44" rx="22" fill="#6366f1"/>
    <text x="155" y="320" text-anchor="middle" fill="#fff">Get started</text>
    <rect x="244" y="292" width="150" height="44" rx="22" fill="none" stroke="#3f3f46" stroke-width="2"/>
    <text x="319" y="320" text-anchor="middle" fill="#e4e4e7">View demo</text>
  </g>
</svg>
